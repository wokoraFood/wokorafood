services:
  app:
    build: .
    container_name: wokora-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/prod.db
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-replace-with-a-long-random-string}
      STORE_ID: wokora
    volumes:
      - wokora_data:/data

volumes:
  wokora_data:
